<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tenisnorte León · Gestión</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #e4e8ee;border-radius:18px;padding:32px}.brand{font-size:28px;font-weight:800;color:#1167b1}.sub,.muted{color:#667085}.sub{margin:6px 0 26px}.field{margin:14px 0}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #ccd3dd;border-radius:10px;font-size:15px}button{border:0;border-radius:10px;padding:13px;background:#1167b1;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.loginbtn{width:100%}.msg{margin-top:14px;font-size:14px}.err{color:#b42318}.app{display:none;min-height:100vh}.side{width:240px;background:#fff;border-right:1px solid #e4e8ee;padding:24px;position:fixed;inset:0 auto 0 0}.side h2{color:#1167b1;margin:0 0 28px}.nav{padding:11px 12px;border-radius:9px;margin:5px 0}.nav.active{background:#e8f3ff;color:#1167b1;font-weight:800}.main{margin-left:240px;padding:30px}.top{display:flex;justify-content:space-between;align-items:center}.logout{background:#eef2f6;color:#344054;padding:9px 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:25px}.stat{background:#fff;border:1px solid #e4e8ee;border-radius:14px;padding:20px}.num{font-size:32px;font-weight:800;margin-top:6px}@media(max-width:700px){.side{display:none}.main{margin:0}.stats{grid-template-columns:1fr}}</style></head>
<body><div id="login" class="wrap"><div class="card"><div class="brand">TENISNORTE LEÓN</div><div class="sub">Gestión interna · Acceso privado</div><form id="form"><div class="field"><label>Correo electrónico</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button class="loginbtn">Entrar</button><button id="forgot" type="button" style="width:100%;background:transparent;color:#1167b1;padding:11px 0 0">¿Has olvidado tu contraseña?</button><div id="msg" class="msg"></div></form></div></div>
<div id="app" class="app"><aside class="side"><h2>TENISNORTE</h2><div class="nav active">🗓️ Planning</div><div class="nav">🎾 Escuela / Alumnos</div><div class="nav">👥 Entrenadores</div><div class="nav">🏆 Torneos</div><div class="nav">🎾 Liga</div><div class="nav">🏅 Ranking</div><div class="nav">💳 Facturación</div></aside><main class="main"><div class="top"><div><h1>Panel de gestión</h1><div id="who" class="muted"></div></div><div style="display:flex;gap:8px"><button id="changePass" class="logout">Cambiar contraseña</button><button id="logout" class="logout">Cerrar sesión</button></div></div><div class="stats"><div class="stat"><div class="muted">Alumnos activos</div><div id="students" class="num">—</div></div><div class="stat"><div class="muted">Entrenadores activos</div><div id="coaches" class="num">—</div></div><div class="stat"><div class="muted">Próximos eventos</div><div id="events" class="num">—</div></div></div></main></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://psukusvdvxkgzetwabqs.supabase.co','sb_publishable_oP66gVw0hxZZ5WMryVgpBg_m8M9fG1v');
window.__tn_sb=sb;const login=document.querySelector('#login'),app=document.querySelector('#app'),msg=document.querySelector('#msg');
async function enter(session){const {data:p,error}=await sb.from('app_users').select('display_name,role,active').eq('user_id',session.user.id).maybeSingle();if(error||!p||!p.active){msg.className='msg err';msg.textContent='Este usuario no tiene acceso activo.';await sb.auth.signOut();return}login.style.display='none';app.style.display='block';document.querySelector('#who').textContent=(p.display_name||session.user.email)+' · '+p.role;const [s,c,e]=await Promise.all([sb.from('students').select('id',{count:'exact',head:true}).eq('active',true),sb.from('coaches').select('id',{count:'exact',head:true}).eq('active',true),sb.from('events').select('id',{count:'exact',head:true}).gte('starts_at',new Date().toISOString())]);students.textContent=s.count??'—';coaches.textContent=c.count??'—';events.textContent=e.count??'—'}
form.addEventListener('submit',async ev=>{ev.preventDefault();msg.className='msg';msg.textContent='Entrando…';const {data,error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.className='msg err';msg.textContent='No se ha podido iniciar sesión. Revisa correo y contraseña.';return}await enter(data.session)});
document.querySelector('#forgot').onclick=async()=>{const mail=email.value.trim();if(!mail){msg.className='msg err';msg.textContent='Introduce primero tu correo electrónico.';return}msg.className='msg';msg.textContent='Enviando correo de recuperación…';const {error}=await sb.auth.resetPasswordForEmail(mail,{redirectTo:'https://tenisnorte-gestion.vercel.app'});if(error){msg.className='msg err';msg.textContent='No se ha podido enviar el correo de recuperación.';return}msg.className='msg';msg.textContent='Te hemos enviado un correo para cambiar tu contraseña.'};const pm=document.querySelector('#passModal'),pmg=document.querySelector('#passMsg');changePass.onclick=()=>{pm.style.display='grid';newPass.value='';newPass2.value='';pmg.textContent=''};cancelPass.onclick=()=>pm.style.display='none';savePass.onclick=async()=>{if(newPass.value.length<8){pmg.className='msg err';pmg.textContent='La contraseña debe tener al menos 8 caracteres.';return}if(newPass.value!==newPass2.value){pmg.className='msg err';pmg.textContent='Las contraseñas no coinciden.';return}const {error}=await sb.auth.updateUser({password:newPass.value});if(error){pmg.className='msg err';pmg.textContent='No se ha podido cambiar la contraseña.';return}pmg.className='msg';pmg.textContent='Contraseña cambiada correctamente.';setTimeout(()=>pm.style.display='none',900)};logout.onclick=async()=>{await sb.auth.signOut();location.reload()};const {data:{session}}=await sb.auth.getSession();if(session)enter(session);
</script><div id="passModal" style="display:none;position:fixed;inset:0;background:#0005;place-items:center;z-index:20"><div class="card"><h2>Nueva contraseña</h2><div class="field"><label>Nueva contraseña</label><input id="newPass" type="password" minlength="8"></div><div class="field"><label>Repite la contraseña</label><input id="newPass2" type="password" minlength="8"></div><button id="savePass" class="loginbtn">Guardar nueva contraseña</button><button id="cancelPass" type="button" style="width:100%;margin-top:8px;background:#eef2f6;color:#344054">Cancelar</button><div id="passMsg" class="msg"></div></div></div>
<script type="module">
const sb=window.__tn_sb;
</script></body></html>
